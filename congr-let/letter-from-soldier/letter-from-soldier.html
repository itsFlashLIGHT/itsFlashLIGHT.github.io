<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Письмо от Неизвестного солдата</title>
    <style>
        @font-face {
            font-family: 'RustFont';
            src: url('rust.ttf') format('truetype');
        }

        body {
            font-family: 'RustFont', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://i.pinimg.com/originals/a5/60/ee/a560ee6aa4dda4cf1052822a3c167ef2.gif');
            background-size: cover;
            background-position: center;
        }

        .container {
            background: rgba(50, 50, 50, 0.9);
            border-radius: 20px;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            min-height: 80vh;
            text-align: left;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 40px;
            margin-top: 20px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        label {
            color: #ffffff;
            margin: 10px 0 5px;
        }

        canvas {
            border: 1px solid black;
            margin-top: 20px;
            display: block;
        }

        input, button {
            font-family: 'RustFont', sans-serif;
            font-size: 20px;
            margin: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            backdrop-filter: blur(5px);
        }

        button {
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Письмо от Неизвестного солдата</h1>

        <!-- Поля для ввода имени и возраста -->
        <label for="nameInput">Имя:</label>
        <input type="text" id="nameInput" placeholder="Введите имя">

        <label for="ageInput">Возраст:</label>
        <input type="number" id="ageInput" placeholder="Введите возраст">

        <!-- Кнопки для генерации и скачивания письма -->
        <button id="generateButton">Предпросмотр письма</button>
        <canvas id="letterCanvas" width="600" height="1000"></canvas>
        <button id="downloadButton">Скачать письмо</button>
    </div>

    <script>
        // Тексты писем с разбивкой на абзацы
        const texts = {
            text1: `Здравствуй, {name},\n\nВ этом году мы отмечаем 80-ю годовщину Великой Победы – дня, который стал символом мужества, чести и несгибаемой воли нашего народа. Мы сражались за мирное небо, и теперь ваша задача – сохранить его, помня о подвигах прошлого и строя достойное будущее.\n\nЯ пишу тебе, чтобы вдохновить на успешную учебу и новые достижения. Каждый день, погружаясь в знания, ты строишь своё будущее, которое обязательно будет светлым и интересным.\n\nПомни, что каждая трудность — это лишь ступенька к успеху. Не бойся задавать вопросы, стремиться к лучшему и верить в себя. Удача обычно улыбается тем, кто усердно трудится и не сдается перед преградами.\n\nЖелаю тебе терпения, настойчивости и веры в свои силы. Учись с радостью и вдохновением, ведь это время – самое важное в твоей жизни.\n\nС уважением,\nНеизвестный солдат`,
            text2: `Здравствуй, {name},\n\n80 лет назад наш народ одержал Великую Победу, отстояв свободу и мир для будущих поколений. Помни, что сила духа, настойчивость и труд – ключи к великим свершениям, и именно от вас зависит, каким будет завтрашний день.\n\nЯ пишу тебе, чтобы напомнить, как важна учеба и стремление к знаниям. Каждый день — это возможность стать лучше, узнать что-то новое и сделать шаг к своим мечтам. Учеба требует усердия и терпения, но эти усилия принесут плоды.\n\nПусть каждое занятие будет для тебя шагом к успеху. Не бойся встречать трудности — они закаляют дух и делают сильнее. Удача сопутствует тем, кто верит в себя и упорно трудится.\n\nПомни, что каждый маленький успех — это значительное достижение. Желаю тебе удачи во всех начинаниях. Сохраняй любопытство и не останавливайся на достигнутом.\n\nС уважением,\nНеизвестный солдат`,
            text3: `Здравствуй, {name},\n\nСегодня мы вспоминаем подвиги наших предков, которые отстояли свободу и мир для будущих поколений. Их мужество и стойкость вдохновляют нас на великие дела.\n\nЯ пишу тебе, чтобы напомнить, как важно быть добрым, честным и трудолюбивым человеком. Каждый день — это возможность стать лучше, узнать что-то новое и сделать шаг к своим мечтам.\n\nУчись с радостью и вдохновением, ведь знания — это ключ к успеху. Не бойся трудностей, они делают нас сильнее. Помни, что каждый маленький успех — это значительное достижение.\n\nЖелаю тебе счастья, здоровья и исполнения всех желаний. Пусть твоя жизнь будет наполнена радостью и светом.\n\nС уважением,\nНеизвестный солдат`,
            text4: `Дорогой {name},\n\nПрошло много лет с тех пор, как наш народ одержал Великую Победу. Это был подвиг, который навсегда останется в памяти поколений. Мы сражались за мирное будущее, и теперь ваша задача — сохранить его.\n\nЯ пишу тебе, чтобы вдохновить на новые достижения. Каждый день — это шанс стать лучше, узнать что-то новое и сделать шаг к своим мечтам. Не бойся трудностей, они делают нас сильнее.\n\nПусть твоя жизнь будет наполнена радостью, успехами и счастьем. Помни, что каждый день — это возможность сделать мир лучше.\n\nС уважением,\nНеизвестный солдат`,
            text5: `Приветствую тебя, {name},\n\nСегодня мы вспоминаем подвиги наших предков, которые отстояли свободу и мир для будущих поколений. Их мужество и стойкость вдохновляют нас на великие дела.\n\nЯ пишу тебе, чтобы напомнить, как важно быть добрым, честным и трудолюбивым человеком. Каждый день — это возможность стать лучше, узнать что-то новое и сделать шаг к своим мечтам.\n\nУчись с радостью и вдохновением, ведь знания — это ключ к успеху. Не бойся трудностей, они делают нас сильнее. Помни, что каждый маленький успех — это значительное достижение.\n\nС уважением,\nНеизвестный солдат`,
            text6: `Дорогой {name},\n\nПрошло много лет с тех пор, как наш народ одержал Великую Победу. Это был подвиг, который навсегда останется в памяти поколений. Мы сражались за мирное будущее, и теперь ваша задача — сохранить его.\n\nЯ пишу тебе, чтобы вдохновить на новые достижения. Каждый день — это шанс стать лучше, узнать что-то новое и сделать шаг к своим мечтам. Не бойся трудностей, они делают нас сильнее.\n\nПусть твоя жизнь будет наполнена радостью, успехами и счастьем. Помни, что каждый день — это возможность сделать мир лучше.\n\nС уважением,\nНеизвестный солдат`
        };

        // Функция для переноса текста на несколько строк с учетом абзацев
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n\n'); // Разделяем текст на абзацы
            paragraphs.forEach(paragraph => {
                const words = paragraph.split(' ');
                let line = '';
                for (let i = 0; i < words.length; i++) {
                    const testLine = line + words[i] + ' ';
                    const metrics = ctx.measureText(testLine);
                    const testWidth = metrics.width;
                    if (testWidth > maxWidth && line.length > 0) {
                        ctx.fillText(line, x, y);
                        line = words[i] + ' ';
                        y += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, y);
                y += lineHeight * 1.5; // Добавляем отступ между абзацами
            });
        }

        // Функция для генерации письма
        function generateLetter() {
            const name = document.getElementById('nameInput').value.trim();
            const ageInput = document.getElementById('ageInput').value.trim();
            const age = parseInt(ageInput, 10);

            if (!name || isNaN(age)) {
                alert('Пожалуйста, заполните все поля корректно!');
                return;
            }

            // Выбор текста в зависимости от возраста
            let textKey;
            if (age < 18) {
                const randomIndex = Math.floor(Math.random() * 3) + 1; // Случайный текст 1-3
                textKey = `text${randomIndex}`;
            } else {
                const randomIndex = Math.floor(Math.random() * 3) + 4; // Случайный текст 4-6
                textKey = `text${randomIndex}`;
            }

            const text = texts[textKey].replace('{name}', name); // Подставляем имя в текст

            const canvas = document.getElementById('letterCanvas');
            const ctx = canvas.getContext('2d');

            const background = new Image();
            const randomTemplateIndex = Math.floor(Math.random() * 5) + 1; // Случайный шаблон от 1 до 5
            background.src = `templates/template${randomTemplateIndex}.png`;

            background.onload = function () {
                ctx.drawImage(background, 0, 0, canvas.width, canvas.height); // Рисуем фон
                ctx.font = "18px 'RustFont', sans-serif"; // Уменьшен размер шрифта
                ctx.fillStyle = "black";
                wrapText(ctx, text, 50, 300, 500, 25); // Рисуем текст письма
            };
        }

        // Функция для скачивания письма
        function downloadLetter() {
            const canvas = document.getElementById('letterCanvas');
            const link = document.createElement('a');
            link.download = 'letter.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Привязываем функции к кнопкам
        document.getElementById('generateButton').addEventListener('click', generateLetter);
        document.getElementById('downloadButton').addEventListener('click', downloadLetter);
    </script>
</body>
</html>
